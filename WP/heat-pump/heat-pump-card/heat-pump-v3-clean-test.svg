<svg xmlns="http://www.w3.org/2000/svg" data-symcon-modern="3" viewBox="0 0 1200 760" width="1200" height="760">
<defs>
  <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46515d"/><stop offset="1" stop-color="#242b33"/></linearGradient>
  <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#313a44"/><stop offset=".48" stop-color="#56616c"/><stop offset="1" stop-color="#252c34"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".28"/></filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text{font-family:Arial,sans-serif;fill:currentColor}
    .label{font-size:16px;opacity:.72}
    .value{font-size:21px;font-weight:700}
    .small{font-size:14px;opacity:.72}
    .pipe{fill:none;stroke:#6d7883;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
    .pipeInner{fill:none;stroke:#aeb8c1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.45}
    .unit{fill:url(#case);stroke:#78838d;stroke-width:1.5;filter:url(#shadow)}
    .tank{fill:url(#tank);stroke:#7f8b96;stroke-width:1.5;filter:url(#shadow)}
    .panel{fill:#1f262d;fill-opacity:.78;stroke:#76818b;stroke-opacity:.55}
    .accent{fill:#86d8ff}
  </style>
</defs>

<!-- ambient values -->
<g id="gEnvironment">
  <text x="50" y="52" class="label">Aussen</text>
  <text id="textOutdoorTemperatureValue" x="50" y="80" class="value">-- °C</text>
  <text x="50" y="116" class="label">Raum</text>
  <text id="textIndoorTemperatureValue" x="50" y="144" class="value">-- °C</text>
</g>

<!-- Heat pump, designed from scratch -->
<g id="gHP" transform="translate(115 125)">
  <rect class="unit" x="0" y="0" width="350" height="320" rx="26"/>
  <rect x="16" y="16" width="318" height="288" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="28" y="40" class="label">WÄRMEPUMPE</text>
  <g id="gHPFan" transform="translate(76 122)">
    <circle cx="0" cy="0" r="60" fill="#151b20" stroke="#7c8790" stroke-width="3"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#66717a" stroke-width="2"/>
    <path id="pathHPFan" d="M0-40 C26-40 34-18 12-4 C42 4 39 30 13 31 C1 55-23 45-20 17 C-49 13-51-14-24-23 C-23-48 2-56 0-40Z" fill="#87939d"/>
    <circle cx="0" cy="0" r="8" fill="#cbd3da"/>
  </g>
  <g transform="translate(180 78)">
    <rect class="panel" x="0" y="0" width="138" height="185" rx="15"/>
    <text id="textEvaporator" x="16" y="30" class="small">Verdampfer</text>
    <text id="textEvaporatorTemperature" x="16" y="53" class="value">--</text>
    <text id="textEvaporatorPressure" x="82" y="53" class="small">--</text>
    <path id="pathCompressor" d="M24 91 h90" stroke="#87939d" stroke-width="18" stroke-linecap="round"/>
    <text id="textCompressor" x="16" y="86" class="small">Verdichter</text>
    <text id="textCompressorValue" x="16" y="116" class="value">--</text>
    <text id="textCondenser" x="16" y="146" class="small">Kondensator</text>
    <text id="textCondenserTemperature" x="16" y="171" class="value">--</text>
    <text id="textCondenserPressure" x="82" y="171" class="small">--</text>
  </g>
  <text id="textExpansionValve" x="28" y="285" class="small">Expansionsventil</text>
  <text id="textExpansionValveOpening" x="145" y="285" class="small">--</text>
  <g id="gHPG2W"></g><g id="gHPW2W"></g>
  <g id="gHPG2WPumpBladeWheel"></g><g id="gHPW2WPumpBladeWheel"></g>
</g>


<g id="modernHydraulicHeader">
  <rect x="500" y="120" width="230" height="62" rx="16" fill="#242c33" stroke="#697680" stroke-opacity=".7"/>
  <text x="520" y="146" class="small">HYDRAULIK</text>
  <text x="520" y="169" class="label">Vorlauf / Rücklauf</text>
</g>

<!-- main supply -->
<g id="gPipe">
  <path class="pipe" d="M520 285 H610 V178 H760"/>
  <path class="pipeInner" d="M520 285 H610 V178 H760"/>
  <text id="textSupplyTemperatureLabel" x="548" y="252" class="small">Vorlauf</text>
  <text id="textSupplyTemperatureValue" x="548" y="277" class="value">-- °C</text>
</g>

<!-- Buffer tank -->
<g id="gTankHP" transform="translate(760 80)">
  <ellipse class="tank" cx="105" cy="34" rx="105" ry="28"/>
  <rect class="tank" x="0" y="34" width="210" height="270"/>
  <ellipse class="tank" cx="105" cy="304" rx="105" ry="28"/>
  <path d="M24 65 H186 M24 169 H186 M24 270 H186" stroke="#fff" stroke-opacity=".08"/>
  <text id="textTankHPName" x="105" y="80" text-anchor="middle" class="label">Pufferspeicher</text>
  <text id="textTankTempHPUp" x="105" y="128" text-anchor="middle" class="value">-- °C</text>
  <text id="textTankTempHPMiddle" x="105" y="214" text-anchor="middle" class="value">-- °C</text>
  <text id="textTankTempHPDown" x="105" y="286" text-anchor="middle" class="value">-- °C</text>
  <path id="pathHeaterRodHP" d="M176 238 h-42 l-14 14 14 14 h42" fill="none" stroke="#f5c35b" stroke-width="6"/>
</g>

<!-- Domestic hot water -->
<g id="gWW" transform="translate(990 80)">
  <ellipse class="tank" cx="88" cy="34" rx="88" ry="27"/>
  <rect class="tank" x="0" y="34" width="176" height="270"/>
  <ellipse class="tank" cx="88" cy="304" rx="88" ry="27"/>
  <text id="textTankWWName" x="88" y="80" text-anchor="middle" class="label">Warmwasser</text>
  <text id="textTankTempWWUp" x="88" y="128" text-anchor="middle" class="value">-- °C</text>
  <text id="textTankTempWWMiddle" x="88" y="214" text-anchor="middle" class="value">-- °C</text>
  <text id="textTankTempWWDown" x="88" y="286" text-anchor="middle" class="value">-- °C</text>
</g>

<g id="gPipeBuffer"><path id="pathPipeToBuffer" class="pipe" d="M760 178 H710 V430 H610"/><path id="pathPipeFromBuffer" class="pipe" d="M760 330 H690 V455 H610"/><path id="pathPipeToHP2" class="pipe" d="M610 455 H520"/></g>

<!-- Pumps / valve -->
<g id="gStorageChargingPump" transform="translate(696 178)"><circle r="20" fill="#273039" stroke="#94a0aa" stroke-width="3"/><path d="M-7-10 L12 0 -7 10Z" fill="#b7c2ca"/></g>
<g id="gCirculatingPump" transform="translate(1080 395)"><circle r="20" fill="#273039" stroke="#94a0aa" stroke-width="3"/><g id="gCirculatingPumpBladeWheel"><path d="M-7-10 L12 0 -7 10Z" fill="#b7c2ca"/></g><text id="textCirculatingPump" x="-54" y="43" class="small">Zirkulation</text></g>
<g id="gWWHeatingValve" transform="translate(958 178)"><circle r="13" fill="#273039" stroke="#94a0aa" stroke-width="2"/><path d="M-8-8 L8 8 M8-8 L-8 8" stroke="#c7d0d7" stroke-width="3"/></g>

<!-- Heating circuits -->
<g id="gHeaterCircuit1" transform="translate(355 535)">
  <rect class="panel" x="0" y="0" width="420" height="145" rx="18"/>
  <text x="22" y="31" class="label">HEIZKREIS 1</text>
  <g id="gHeatingCircuitPump" transform="translate(42 76)"><circle r="18" fill="#273039" stroke="#94a0aa" stroke-width="3"/><path d="M-6-9 L11 0 -6 9Z" fill="#b7c2ca"/></g>
  <path d="M72 76 H260" class="pipe"/><path d="M72 76 H260" class="pipeInner"/>
  <text id="textSupplyTemperatureHeating" x="88" y="64" class="value">--</text>
  <text id="textRefluxTemperatureHeating" x="200" y="111" class="value">--</text>
  <g id="gHeaterCircuitFloor1"><path d="M86 98 q18-22 36 0 t36 0 t36 0 t36 0" fill="none" stroke="#84909a" stroke-width="4"/></g>
  <g id="radiator1"></g>
</g>
<g id="gHeaterCircuit2" transform="translate(475 545)">
  <rect class="panel" x="0" y="0" width="300" height="135" rx="18"/><text x="22" y="31" class="label">HEIZKREIS 2</text>
  <g id="gHeatingCircuitPump2" transform="translate(42 76)"><circle r="18" fill="#273039" stroke="#94a0aa" stroke-width="3"/><path d="M-6-9 L11 0 -6 9Z" fill="#b7c2ca"/></g>
  <path d="M72 76 H260" class="pipe"/><text id="textSupplyTemperatureHeating2" x="88" y="64" class="value">--</text><text id="textRefluxTemperatureHeating2" x="200" y="111" class="value">--</text>
  <g id="gHeaterCircuitFloor2"><path d="M86 98 q18-22 36 0 t36 0 t36 0 t36 0" fill="none" stroke="#84909a" stroke-width="4"/></g><g id="radiator2"></g>
</g>
<g id="gHeaterCircuit3" transform="translate(790 545)">
  <rect class="panel" x="0" y="0" width="300" height="135" rx="18"/><text x="22" y="31" class="label">HEIZKREIS 3</text>
  <g id="gHeatingCircuitPump3" transform="translate(42 76)"><circle r="18" fill="#273039" stroke="#94a0aa" stroke-width="3"/><path d="M-6-9 L11 0 -6 9Z" fill="#b7c2ca"/></g>
  <path d="M72 76 H260" class="pipe"/><text id="textSupplyTemperatureHeating3" x="88" y="64" class="value">--</text><text id="textRefluxTemperatureHeating3" x="200" y="111" class="value">--</text>
  <g id="gHeaterCircuitFloor3"><path d="M86 98 q18-22 36 0 t36 0 t36 0 t36 0" fill="none" stroke="#84909a" stroke-width="4"/></g><g id="radiator3"></g>
</g>

<!-- Optional solar -->
<g id="gThermalSolar" transform="translate(25 260)">
  <path d="M0 65 L95 35 L115 105 L20 135Z" fill="#27495c" stroke="#78a8c3" stroke-width="2"/>
  <path d="M18 61 L38 128 M42 53 L62 120 M66 46 L86 113" stroke="#78a8c3" stroke-opacity=".5"/>
  <text x="0" y="160" class="small">Solarthermie</text>
  <text id="textThermalSolarPanelTemp" x="0" y="185" class="value">--</text>
  <text id="textThermalSolarFluxTemp" x="0" y="209" class="small">--</text>
  <text id="textThermalSolarPumpSpeed" x="0" y="231" class="small">--</text>
  <g id="gThermalSolarPump" transform="translate(108 142)"><circle r="15" fill="#273039" stroke="#94a0aa" stroke-width="2"/></g>
</g>

<g id="gAdditionalHeating"></g><g id="gWarning"></g><g id="gError"></g><g id="gDefrost"></g>

